contrat salarié . type de contrat:
  titre: Quel est le type du contrat de travail ?
  cdtn:
    type: liste
    valeurs:
      CDD de remplacement: "'CDD'"
      CDD d'accroissement temporaire d'activité: "'CDD'"
      Contrat de travail temporaire (intérimaire): "'CTT'"
      Autres: "'Exclu'"

contrat salarié . type de cdd:
  titre: Quel est le type de CDD ?
  cdtn:
    type: liste
    valeurs:
      Autres: "'Autres'"
      CDD d'usage conclu avec les convoyeurs de véhicules: "'usage convoyeurs'"
      CDD d'usage pour les enquêteurs vacataires: "'usage enquêteurs vacataires'"
      CDD d'usage / CDD d'intervention pour le secteur évènementiel: "'usage intervention évènementiel'"
      CDD d'usage pour les formateurs: "'usage formateurs'"
      CDD d'optimisation linéaire: "'optimisation linéaire'"
      CDD d'animation commerciale: "'animation commerciale'"
      CDD d'usage / contrat d'intervention: "'usage intervention sport'"
      CDD d'usage / CDD de mission ponctuelle ou occasionnelle: "'usage mission ponctuelle'"

contrat salarié . fin à la date prévue:
  titre: Le contrat a-t-il pris fin à la date initialement prévue (pas de rupture anticipée) ?
  cdtn:
    type: liste
    valeurs:
      Oui: "'oui'"
      Non: "'non'"

contrat salarié . issue du contrat:
  titre: Quelle a été l'issue du contrat ?
  cdtn:
    type: liste
    valeurs:
      Le salarié a été immédiatement embauché en CDI: "'embauche cdi'"
      Le salarié a refusé un CDI équivalent: "'refus cdi équivalent'"
      Le salarié a refusé la mise en œuvre de la souplesse prévue au contrat de mission: "'refus souplesse'"
      Rupture pendant la période d'essai: "'période d'essai'"
      Rupture pour force majeure: "'force majeure'"
      Rupture pour faute grave: "'faute grave'"
      Rupture en cas d'embauche en CDI dans une autre entreprise: "'embauche cdi autre entreprise'"
      Rupture pour inaptitude du salarié prononcée par le médecin du travail: "'inaptitude'"
      Rupture d'un commun accord entre l'employeur et le salarié: "'commun accord'"
      Autre: "'autre'"

contrat salarié . salaire de référence:
  unité: €

contrat salarié . résultat légal:
  valeur:
    produit:
      assiette: contrat salarié . salaire de référence
      facteur: 0.1
  arrondi: 2 décimales
  unité: €
  cdtn:
    formule:
      explanations:
        - "S : Salaires renseignés": contrat salarié . salaire de référence
      formula: 1/10 * S

# Les références dépendent de la famille de contrat : indemnité de fin de contrat
# pour le CDD, indemnité de fin de mission pour le CTT. `getReferences` ne retient
# que les règles dont l'évaluation n'est pas nulle, donc seule la branche
# applicable remonte à l'écran de résultat.
contrat salarié . résultat légal . références cdd:
  applicable si: contrat salarié . type de contrat = 'CDD'
  valeur: oui
  références:
    Article L1243-4 du code du travail: https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000024026880
    Article L1243-8 du code du travail: https://www.legifrance.gouv.fr/affichCodeArticle.do?idArticle=LEGIARTI000006901219&cidTexte=LEGITEXT000006072050&dateTexte=20080501
    Article L1243-9 du code du travail: https://www.legifrance.gouv.fr/affichCodeArticle.do;jsessionid=0FA35871C82B78139407AE9BD9480D9B.tplgfr31s_2?idArticle=LEGIARTI000006901220&cidTexte=LEGITEXT000006072050&dateTexte=20080501&categorieLien=id&oldAction=&nbResultRech=
    Article L1243-10 du code du travail: https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000006901221

contrat salarié . résultat légal . références ctt:
  applicable si: contrat salarié . type de contrat = 'CTT'
  valeur: oui
  références:
    Article L1251-32 du code du travail: https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000006901285
    Article L1251-33 du code du travail: https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000019869550

contrat salarié . convention collective . résultat conventionnel:
  valeur: 0
