# ============================================================================
# code-du-travail-numerique (site public CDTN) — CI + CD sur GitLab PIC.
#   build   : 1 image Next.js via BuildKit DinD mutualisé (ci-common). GitHub reste
#             la source de vérité (ce dépôt PIC est un miroir + cible de déploiement).
#   publish : chart Helm `charts/code-du-travail-numerique` en OCI (appVersion = sha).
#   deploy  : DÉCLENCHE le pipeline cdtn-gitops (trigger multi-projet, CI_JOB_TOKEN +
#             allowlist inbound côté gitops) en passant CHART_NAME/CHART_VERSION. Pas de
#             token gitops ici.
# Déploiement : Atlas v2 (zone dev) via ArgoCD synchronisant cdtn-gitops.
# Voir docs/30-migrations/cdtn.md.
#
# ⚠ Secrets de build (ES/OAuth/Sentry) : le Dockerfile les monte en `--mount=type=secret`
# MAIS chaque usage est gardé par `if [ -f /run/secrets/X ]` ⇒ build OK SANS secret (mounts
# `type=secret` optionnels par défaut). Seul SENTRY_AUTH_TOKEN est transmis (BUILD_SECRETS
# de ci-common, cf. job build) pour l'upload des sourcemaps ; sans la variable CI/CD, le
# build passe quand même, sans upload.
# ============================================================================

include:
  - project: socialgouv/commun/studio-tech-commun/sdpsn-devops-ci-utils
    ref: main
    file: ci-common/image-build.yml
  - component: $CI_SERVER_FQDN/socialgouv/commun/studio-tech-commun/components/gitops-cd-component/trigger_app@0.6.0
    inputs:
      job_name: deploy-dev
      stage: deploy
      rules:
        - if: $SCHEDULED_JOB
          when: never
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      gitops_project: socialgouv/produits-dnum/citoyens/cdtn/cdtn-gitops
      app_name: cdtn
      deploy_action: dev
      image_target_object: ".code-du-travail-numerique.image.tag"
  - component: $CI_SERVER_FQDN/socialgouv/commun/studio-tech-commun/components/gitops-cd-component/trigger_app@0.6.0
    inputs:
      job_name: deploy-test
      stage: deploy
      rules:
        - if: $SCHEDULED_JOB
          when: never
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      gitops_project: socialgouv/produits-dnum/citoyens/cdtn/cdtn-gitops
      app_name: cdtn
      deploy_action: test
      image_target_object: ".code-du-travail-numerique.image.tag"
  - component: $CI_SERVER_FQDN/socialgouv/commun/studio-tech-commun/components/gitops-cd-component/trigger_app@0.6.0
    inputs:
      job_name: deploy-preprod
      stage: deploy
      rules:
        - if: $SCHEDULED_JOB
          when: never
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      gitops_project: socialgouv/produits-dnum/citoyens/cdtn/cdtn-gitops
      app_name: cdtn
      deploy_action: preprod
      image_target_object: ".code-du-travail-numerique.image.tag"
  - component: $CI_SERVER_FQDN/socialgouv/commun/studio-tech-commun/components/gitops-cd-component/trigger_app@0.6.0
    inputs:
      job_name: deploy-prod
      stage: deploy
      rules:
        - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      gitops_project: socialgouv/produits-dnum/citoyens/cdtn/cdtn-gitops
      app_name: cdtn
      deploy_action: prod
      image_target_object: ".code-du-travail-numerique.image.tag"

variables:
  # La configuration par environnement est lue à l'exécution (image unique), plus de
  # build-args NEXT_PUBLIC_* ici. URL de la dev, cible des e2e et de lighthouse.
  E2E_BASE_URL: "https://code-du-travail-numerique.env-01m2jrqx2bm61pzggw4v5hdfs1.dev.atlas-prod.public-cloud.social.gouv.fr"
  # Proxy sortant du PIC, défini une fois : repris par les jobs `.node` (env du job) et par
  # le job `build` (build-args). Noms dédiés : sans effet tant qu'un job ne les reprend pas.
  PIC_PROXY: "http://proxyweb.intranet.social.gouv.fr:8002"
  PIC_NO_PROXY: "pic.sg.social.gouv.fr,localhost,127.0.0.1"

stages:
  - build
  - deploy
  - test
  - release

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

.build-rules: &build-rules
  - if: $SCHEDULED_JOB
    when: never
  - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  - if: $CI_COMMIT_BRANCH =~ /^(feat|fix|chore|migration)\//
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.node:
  stage: test
  image: node:24.22.1-bookworm
  tags: [socialgouv-linux-small-amd64]
  interruptible: true
  needs: []
  variables:
    HTTP_PROXY: $PIC_PROXY
    HTTPS_PROXY: $PIC_PROXY
    NO_PROXY: $PIC_NO_PROXY
    http_proxy: $PIC_PROXY
    https_proxy: $PIC_PROXY
    no_proxy: $PIC_NO_PROXY
  cache:
    key:
      files: [pnpm-lock.yaml]
    paths: [.pnpm-store]
  before_script:
    - npm install -g pnpm@11.9.0
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  rules: *build-rules

.node-workspace:
  extends: .node
  variables:
    PACKAGES: --filter @cdt/frontend --filter @socialgouv/modeles-social --filter @socialgouv/cdtn-utils --filter @socialgouv/cdtn-stats
  script:
    - pnpm --filter @socialgouv/cdtn-utils --filter @socialgouv/modeles-social build
    - pnpm --no-bail --workspace-concurrency=1 $PACKAGES run $CHECK $CHECK_ARGS

quality-build:
  extends: .node
  tags: [socialgouv-linux-medium-amd64]
  script:
    - pnpm build

quality-lint:
  extends: .node-workspace
  variables:
    CHECK: lint
    CHECK_ARGS: --quiet

quality-format:
  extends: .node-workspace
  variables:
    CHECK: format:check

quality-type-check:
  extends: .node-workspace
  variables:
    CHECK: type-check

quality-test:
  extends: .node-workspace
  services:
    - name: elasticsearch:8.13.4
      alias: elasticsearch
      variables:
        ES_SETTING_DISCOVERY_TYPE: single-node
        ES_SETTING_XPACK_SECURITY_ENABLED: "false"
        ES_SETTING_NODE_STORE_ALLOW__MMAP: "false"
        ES_JAVA_OPTS: -Xms512m -Xmx512m
  variables:
    PACKAGES: --filter @cdt/frontend --filter @socialgouv/modeles-social
    CHECK: test
    ELASTICSEARCH_URL: http://localhost:9200
  script:
    - apt-get update && apt-get install -y --no-install-recommends socat
    - socat TCP-LISTEN:9200,fork,reuseaddr TCP:elasticsearch:9200 &
    - pnpm --filter @socialgouv/cdtn-utils --filter @socialgouv/modeles-social build
    - for i in $(seq 1 60); do curl -fsS "$ELASTICSEARCH_URL/_cat/health?h=status" | grep -Eq '^(green|yellow)$' && break; sleep 2; done
    - curl -fsS "$ELASTICSEARCH_URL/_cat/health?v"
    - unset $(env | grep -o '^NEXT_PUBLIC_[A-Z0-9_]*')
    - pnpm --no-bail --workspace-concurrency=1 $PACKAGES run $CHECK --maxWorkers=2

stats-events:
  extends: .node
  script:
    - pnpm -F @socialgouv/cdtn-stats events:check
    - pnpm -F @socialgouv/cdtn-stats test
  rules:
    - if: $SCHEDULED_JOB
      when: never
    - if: $CI_COMMIT_BRANCH =~ /^(feat|fix|chore|migration)\// || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: ["packages/code-du-travail-stats/**/*", ".gitlab-ci.yml"]

.e2e:
  extends: .node
  variables:
    TEST_BASEURL: $E2E_BASE_URL
    NODE_USE_ENV_PROXY: "1"
  artifacts:
    when: always
    expire_in: 7 days
    paths: [packages/code-du-travail-frontend/playwright-report/]

e2e-heavy:
  extends: .e2e
  script:
    - pnpm --filter @cdt/frontend exec playwright install --with-deps chromium
    - pnpm test:e2e -- --project=chromium --project=widgets
  rules:
    - if: $SCHEDULED_JOB == "e2e-heavy"

e2e-html:
  extends: .e2e
  script:
    - pnpm --filter @cdt/frontend exec playwright install --with-deps chromium
    - pnpm test:e2e -- --project=html-validation
  rules:
    - if: $SCHEDULED_JOB == "e2e-html"

lighthouse:
  extends: .node
  variables:
    LHCI_BASE_URL: $E2E_BASE_URL
  before_script: []
  script:
    - apt-get update && apt-get install -y --no-install-recommends chromium
    - CHROME_PATH=/usr/bin/chromium npx --yes @lhci/cli@0.15.1 autorun --upload.target=filesystem --upload.outputDir=lhci-report --collect.settings.chromeFlags="--no-sandbox --headless=new"
  artifacts:
    when: always
    expire_in: 7 days
    paths: [lhci-report/]
  rules:
    - if: $SCHEDULED_JOB == "lighthouse"

# ---------------------------------------------------------------------------
# BUILD : 1 image via le backend DinD mutualisé (ci-common). cdtn = produit -> DinD.
# ---------------------------------------------------------------------------
build:
  extends: .build-dind
  interruptible: true
  variables:
    BUILD_IMAGE: "$CI_REGISTRY_IMAGE/app"
    BUILD_TAGS: "sha-$CI_COMMIT_SHA,$CI_COMMIT_REF_SLUG"
    # NEXT_PUBLIC_COMMIT sert aussi au nom de release Sentry (cdtn@<version>+<sha>, cf. next.config.mjs).
    # Proxy : passé en build-args et PAS en variables du job. En variables, il écraserait le
    # NO_PROXY="docker" de .build-dind (le CLI docker passerait par le proxy pour joindre
    # tcp://docker:2375) et serait aussi transmis au service dind. HTTP(S)_PROXY/NO_PROXY sont
    # des ARG prédéfinis (hors historique de l'image) ; NODE_USE_ENV_PROXY=1 pour que le fetch
    # de Node les honore (upload Sentry pendant `next build`).
    BUILD_ARGS: |
      NEXT_PUBLIC_COMMIT=$CI_COMMIT_SHA
      HTTP_PROXY=$PIC_PROXY
      HTTPS_PROXY=$PIC_PROXY
      NO_PROXY=$PIC_NO_PROXY
      http_proxy=$PIC_PROXY
      https_proxy=$PIC_PROXY
      no_proxy=$PIC_NO_PROXY
      NODE_USE_ENV_PROXY=1
    # Secret BuildKit (jamais dans un layer) : valeur lue dans la variable CI/CD homonyme
    # (masquée), montée par le Dockerfile via `--mount=type=secret,id=SENTRY_AUTH_TOKEN`.
    BUILD_SECRETS: "SENTRY_AUTH_TOKEN"
  rules: *build-rules

# ---------------------------------------------------------------------------
# DEPLOY : déclenche cdtn-gitops (CI_JOB_TOKEN + allowlist inbound). Bump de la
# dépendance `code-du-travail-numerique` du wrapper apps/cdtn-dev sur la branche par défaut.
# ---------------------------------------------------------------------------
deploy-dev:
  needs: ["build", "prepare-deploy-dev"]
  environment:
    name: dev

deploy-test:
  needs: ["build", "prepare-deploy-test"]
  environment:
    name: test

deploy-preprod:
  needs: ["build", "prepare-deploy-preprod"]
  environment:
    name: preprod

deploy-prod:
  needs: ["build", "prepare-deploy-prod"]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      when: manual
  environment:
    name: prod

# ---------------------------------------------------------------------------
# RELEASE : même chaîne que .github/workflows/release.yml (lerna), mais via une MR car
# `main` est protégée sur la PIC.
#   1. `release` (manuel sur main) : lerna version calcule la version (conventional commits
#      depuis le dernier tag vX.Y.Z), bump des package.json, lerna.json et CHANGELOG commité
#      sur release/vX.Y.Z, MR ouverte (ou mise à jour) vers main.
#   2. `publish-release` (auto sur main, au merge de la MR) : si lerna.json porte une version
#      non taguée, lerna publish from-package (npm : @socialgouv/modeles-social,
#      @socialgouv/cdtn-utils), puis tag vX.Y.Z + release GitLab. Le tag déclenche le
#      pipeline de prod (build + deploy-prod manuel).
# release/* ne déclenche aucun job (hors .build-rules).
# Variables CI/CD requises (masquées) :
#   - GITLAB_TOKEN : scopes api + write_repository (pousse release/*, ouvre la MR, crée le tag).
#   - NPM_TOKEN (facultatif) : token npm avec droit de publication sur le scope @socialgouv
#     (le trusted publishing OIDC npm ne supporte pas les GitLab auto-hébergés). Absent : tag
#     et release GitLab créés, libs non publiées.
# ---------------------------------------------------------------------------
.release-job:
  stage: release
  image: node:24.22.1-bookworm
  tags: [socialgouv-linux-small-amd64]
  needs: []
  variables:
    GIT_DEPTH: "0"
    HTTP_PROXY: $PIC_PROXY
    HTTPS_PROXY: $PIC_PROXY
    NO_PROXY: $PIC_NO_PROXY
    http_proxy: $PIC_PROXY
    https_proxy: $PIC_PROXY
    no_proxy: $PIC_NO_PROXY

release:
  extends: .release-job
  script:
    - .gitlab/release-mr.sh
  rules:
    - if: $SCHEDULED_JOB
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true

publish-release:
  extends: .release-job
  script:
    - .gitlab/release-publish.sh
  rules:
    - if: $SCHEDULED_JOB
      when: never
    # Seulement quand lerna.json change (merge d'une MR release/*). Job en échec : le relancer
    # depuis son pipeline.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [lerna.json]
