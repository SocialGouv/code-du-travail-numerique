# ============================================================================
# code-du-travail-numerique (site public CDTN) — CI + CD sur GitLab PIC.
#   build   : 1 image Next.js via BuildKit DinD mutualisé (ci-common). GitHub reste
#             la source de vérité (ce dépôt PIC est un miroir + cible de déploiement).
#   publish : chart Helm `charts/code-du-travail-numerique` en OCI (appVersion = sha).
#   deploy  : DÉCLENCHE le pipeline cdtn-gitops (trigger multi-projet, CI_JOB_TOKEN +
#             allowlist inbound côté gitops) en passant CHART_NAME/CHART_VERSION. Pas de
#             token gitops ici.
# Déploiement : Atlas v2 (zone dev) via ArgoCD synchronisant cdtn-gitops.
# Voir docs/30-migrations/cdtn.md.
#
# ⚠ Secrets de build (ES/OAuth/Sentry) : le Dockerfile les monte en `--mount=type=secret`
# MAIS chaque usage est gardé par `if [ -f /run/secrets/X ]` ⇒ build OK SANS secret (mounts
# `type=secret` optionnels par défaut). ci-common ne passe pas de `--secret` → on construit
# sans. Si `next build` exige des données ES au build (génération statique), revoir alors
# (rendre les routes dynamiques, ou étendre ci-common pour les build-secrets).
# ============================================================================

include:
  - project: socialgouv/commun/studio-tech-commun/sdpsn-devops-ci-utils
    ref: main
    file: ci-common/image-build.yml
  - component: $CI_SERVER_FQDN/socialgouv/commun/studio-tech-commun/components/gitops-cd-component/trigger_app@0.5.0
    inputs:
      job_name: deploy-dev
      stage: deploy
      rules:
        - if: $SCHEDULED_JOB
          when: never
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      gitops_project: socialgouv/produits-dnum/citoyens/cdtn/cdtn-gitops
      app_name: cdtn
      deploy_action: dev
      image_target_object: ".code-du-travail-numerique.image.tag"
  - component: $CI_SERVER_FQDN/socialgouv/commun/studio-tech-commun/components/gitops-cd-component/trigger_app@0.5.0
    inputs:
      job_name: deploy-test
      stage: deploy
      rules:
        - if: $SCHEDULED_JOB
          when: never
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      gitops_project: socialgouv/produits-dnum/citoyens/cdtn/cdtn-gitops
      app_name: cdtn
      deploy_action: test
      image_target_object: ".code-du-travail-numerique.image.tag"
  - component: $CI_SERVER_FQDN/socialgouv/commun/studio-tech-commun/components/gitops-cd-component/trigger_app@0.5.0
    inputs:
      job_name: deploy-preprod
      stage: deploy
      rules:
        - if: $SCHEDULED_JOB
          when: never
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      gitops_project: socialgouv/produits-dnum/citoyens/cdtn/cdtn-gitops
      app_name: cdtn
      deploy_action: preprod
      image_target_object: ".code-du-travail-numerique.image.tag"

variables:
  # Build-args NEXT_PUBLIC_* (publics, bakés dans l'image). Valeurs dev par défaut, surchargeables
  # en variables CI/CD. NEXT_PUBLIC_SITE_URL : à fixer au host réel après création de l'env Atlas.
  NEXT_PUBLIC_ES_INDEX_PREFIX: "cdtn"
  NEXT_PUBLIC_SITE_URL: "https://code-du-travail-numerique.env-01m2jrqx2bm61pzggw4v5hdfs1.dev.atlas-prod.public-cloud.social.gouv.fr"
  NEXT_PUBLIC_BUCKET_URL: "https://cdtn-dev-public.s3.gra.io.cloud.ovh.net"
  NEXT_PUBLIC_BUCKET_FOLDER: "preview"
  NEXT_PUBLIC_BUCKET_SITEMAP_FOLDER: "sitemap"
  NEXT_PUBLIC_PIWIK_SITE_ID: "3"
  NEXT_PUBLIC_PIWIK_URL: "https://matomo.fabrique.social.gouv.fr"
  NEXT_PUBLIC_SENTRY_ENV: "dev"
  E2E_BASE_URL: "https://code-du-travail-numerique.env-01m3ynefh062yjfa3m1pgqkhe3.dev.atlas-prod.public-cloud.social.gouv.fr"

stages:
  - build
  - deploy
  - test

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_COMMIT_BRANCH

.build-rules: &build-rules
  - if: $SCHEDULED_JOB
    when: never
  - if: $CI_COMMIT_BRANCH =~ /^(feat|fix|chore|migration)\//
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.node:
  stage: test
  image: node:24.22.1-bookworm
  tags: [socialgouv-linux-small-amd64]
  interruptible: true
  needs: []
  variables:
    HTTP_PROXY: http://proxyweb.intranet.social.gouv.fr:8002
    HTTPS_PROXY: http://proxyweb.intranet.social.gouv.fr:8002
    NO_PROXY: pic.sg.social.gouv.fr,localhost,127.0.0.1
    http_proxy: http://proxyweb.intranet.social.gouv.fr:8002
    https_proxy: http://proxyweb.intranet.social.gouv.fr:8002
    no_proxy: pic.sg.social.gouv.fr,localhost,127.0.0.1
  cache:
    key:
      files: [pnpm-lock.yaml]
    paths: [.pnpm-store]
  before_script:
    - npm install -g pnpm@11.9.0
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  rules: *build-rules

.node-workspace:
  extends: .node
  variables:
    PACKAGES: --filter @cdt/frontend --filter @socialgouv/modeles-social --filter @socialgouv/cdtn-utils --filter @socialgouv/cdtn-stats
  script:
    - pnpm --filter @socialgouv/cdtn-utils --filter @socialgouv/modeles-social build
    - pnpm --no-bail --workspace-concurrency=1 $PACKAGES run $CHECK $CHECK_ARGS

quality-build:
  extends: .node
  tags: [socialgouv-linux-medium-amd64]
  script:
    - pnpm build

quality-lint:
  extends: .node-workspace
  variables:
    CHECK: lint
    CHECK_ARGS: --quiet

quality-format:
  extends: .node-workspace
  variables:
    CHECK: format:check

quality-type-check:
  extends: .node-workspace
  variables:
    CHECK: type-check

quality-test:
  extends: .node-workspace
  services:
    - name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/elasticsearch:8.13.4
      alias: elasticsearch
      variables:
        ES_SETTING_DISCOVERY_TYPE: single-node
        ES_SETTING_XPACK_SECURITY_ENABLED: "false"
        ES_SETTING_NODE_STORE_ALLOW__MMAP: "false"
        ES_JAVA_OPTS: -Xms512m -Xmx512m
  variables:
    PACKAGES: --filter @cdt/frontend --filter @socialgouv/modeles-social
    CHECK: test
    ELASTICSEARCH_URL: http://localhost:9200
  script:
    - apt-get update && apt-get install -y --no-install-recommends socat
    - socat TCP-LISTEN:9200,fork,reuseaddr TCP:elasticsearch:9200 &
    - pnpm --filter @socialgouv/cdtn-utils --filter @socialgouv/modeles-social build
    - for i in $(seq 1 60); do curl -fsS "$ELASTICSEARCH_URL/_cat/health?h=status" | grep -Eq '^(green|yellow)$' && break; sleep 2; done
    - curl -fsS "$ELASTICSEARCH_URL/_cat/health?v"
    - unset $(env | grep -o '^NEXT_PUBLIC_[A-Z0-9_]*')
    - pnpm --no-bail --workspace-concurrency=1 $PACKAGES run $CHECK --maxWorkers=2

stats-events:
  extends: .node
  script:
    - pnpm -F @socialgouv/cdtn-stats events:check
    - pnpm -F @socialgouv/cdtn-stats test
  rules:
    - if: $SCHEDULED_JOB
      when: never
    - if: $CI_COMMIT_BRANCH =~ /^(feat|fix|chore|migration)\// || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: ["packages/code-du-travail-stats/**/*", ".gitlab-ci.yml"]

.e2e:
  extends: .node
  variables:
    TEST_BASEURL: $E2E_BASE_URL
  artifacts:
    when: always
    expire_in: 7 days
    paths: [packages/code-du-travail-frontend/playwright-report/]

e2e-heavy:
  extends: .e2e
  script:
    - pnpm --filter @cdt/frontend exec playwright install --with-deps chromium
    - pnpm test:e2e -- --project=chromium --project=widgets
  rules:
    - if: $SCHEDULED_JOB == "e2e-heavy"

e2e-html:
  extends: .e2e
  script:
    - pnpm --filter @cdt/frontend exec playwright install --with-deps chromium
    - pnpm test:e2e -- --project=html-validation
  rules:
    - if: $SCHEDULED_JOB == "e2e-html"

lighthouse:
  extends: .node
  variables:
    LHCI_BASE_URL: $E2E_BASE_URL
  before_script: []
  script:
    - apt-get update && apt-get install -y --no-install-recommends chromium
    - CHROME_PATH=/usr/bin/chromium npx --yes @lhci/cli@0.15.1 autorun --upload.target=filesystem --upload.outputDir=lhci-report --collect.settings.chromeFlags="--no-sandbox --headless=new"
  artifacts:
    when: always
    expire_in: 7 days
    paths: [lhci-report/]
  rules:
    - if: $SCHEDULED_JOB == "lighthouse"

# ---------------------------------------------------------------------------
# BUILD : 1 image via le backend DinD mutualisé (ci-common). cdtn = produit -> DinD.
# ---------------------------------------------------------------------------
build:
  extends: .build-dind
  interruptible: true
  variables:
    BUILD_IMAGE: "$CI_REGISTRY_IMAGE/app"
    BUILD_TAGS: "sha-$CI_COMMIT_SHA,$CI_COMMIT_REF_SLUG"
    BUILD_ARGS: |
      NEXT_PUBLIC_IS_PREPRODUCTION_DEPLOYMENT=true
      NEXT_PUBLIC_ENABLE_AB_TESTING=false
      NEXT_PUBLIC_ES_INDEX_PREFIX=$NEXT_PUBLIC_ES_INDEX_PREFIX
      NEXT_PUBLIC_SITE_URL=$NEXT_PUBLIC_SITE_URL
      NEXT_PUBLIC_BUCKET_URL=$NEXT_PUBLIC_BUCKET_URL
      NEXT_PUBLIC_BUCKET_FOLDER=$NEXT_PUBLIC_BUCKET_FOLDER
      NEXT_PUBLIC_BUCKET_SITEMAP_FOLDER=$NEXT_PUBLIC_BUCKET_SITEMAP_FOLDER
      NEXT_PUBLIC_PIWIK_SITE_ID=$NEXT_PUBLIC_PIWIK_SITE_ID
      NEXT_PUBLIC_PIWIK_URL=$NEXT_PUBLIC_PIWIK_URL
      NEXT_PUBLIC_COMMIT=$CI_COMMIT_SHA
      NEXT_PUBLIC_SENTRY_ENV=$NEXT_PUBLIC_SENTRY_ENV
  rules: *build-rules

# ---------------------------------------------------------------------------
# DEPLOY : déclenche cdtn-gitops (CI_JOB_TOKEN + allowlist inbound). Bump de la
# dépendance `code-du-travail-numerique` du wrapper apps/cdtn-dev sur la branche par défaut.
# ---------------------------------------------------------------------------
deploy-dev:
  needs: ["build", "prepare-deploy-dev"]
  environment:
    name: dev

deploy-test:
  needs: ["build", "prepare-deploy-test"]
  environment:
    name: test

deploy-preprod:
  needs: ["build", "prepare-deploy-preprod"]
  environment:
    name: preprod
