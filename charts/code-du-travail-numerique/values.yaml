# Valeurs par défaut — plateforme-agnostique. Le spécifique-env vit dans le repo gitops.
# Aucun secret ici : les secrets sont référencés PAR NOM (créés par ExternalSecrets côté gitops).

global:
  imageRegistry: ""           # ex. pic-registry.sg.social.gouv.fr/socialgouv/.../code-du-travail-numerique
  imagePullSecrets: []        # ex. [{ name: registry-pull-secret }]
  extraLabels: {}

image:
  repository: app             # ref finale = <global.imageRegistry>/<repository>:<tag|appVersion>
  tag: ""
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

replicaCount: 1

service:
  port: 80
  targetPort: 3000

ingress:
  enabled: true
  className: ""               # "public" sur Atlas v2 (côté gitops)
  host: ""
  annotations: {}             # cert-manager.io/cluster-issuer: letsencrypt (côté gitops)
  tls:
    enabled: true
    secretName: ""

probes:
  path: /api/health
  port: 3000

# requests ≈ limits/2 (LimitRange Atlas : ratio mémoire ≤ 2).
resources:
  requests:
    cpu: "200m"
    memory: "768Mi"
  limits:
    cpu: "1"
    memory: "1536Mi"

# Env non-secret injecté directement.
env: {}

# Rendu dans un ConfigMap (envFrom). Clés par-env (gitops) : ELASTICSEARCH non-secret, PIWIK_*, APM…
configMap:
  data: {}

# Noms de Secrets pré-existants (créés par ExternalSecrets, gitops), chargés via envFrom.
# Liste de noms ; ex. [es-app, sentry].
secrets: []

# Entrées env supplémentaires (raw items, supportent valueFrom).
extraEnv: []

serviceAccount:
  create: true
  name: ""

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

# Stakater Reloader (opt-in) : restart du pod quand un ConfigMap/Secret (envFrom) change.
reloader:
  auto: false
