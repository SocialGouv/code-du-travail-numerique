apiVersion: v1
kind: Service
metadata:
  name: {{ include "cdtn-site.fullname" . }}
  labels:
    {{- include "cdtn-site.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "cdtn-site.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
